services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azuracast-discord-bot
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
